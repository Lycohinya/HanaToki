[versions]
kotlin = "2.4.20-Beta1"

paper-api = "26.2.build.+"
minecraft = "26.2"

shadow = "9.4.3"
run-task = "3.0.2"

# 潘朵拉的少女：殘響(pandora_echo)的外觀呈現引擎,softdepend——見 plugin.yml 與
