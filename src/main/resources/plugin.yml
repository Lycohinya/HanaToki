name: HanaToki
description: $description
prefix: HanaToki
version: '${version}'

main: com.tinyyana.hanatoki.HanaTokiPlugin
api-version: '26.2'
load: POSTWORLD

folia-supported: true

authors: [ TinyYana ]
website: https://tinyyana.com

# Paper library loader:runtime 依賴不 shade,啟動時從 Maven Central 下載
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.20-Beta1

# 引擎本體零依賴:不 depend/softdepend 任何其他插件(玩法內容一律由消費端插件自行提供)。

commands:
  hanatoki:
    description: HanaToki 副本引擎指令(Phase 1:進出測試 + 管理員工具,無 GUI)
    aliases: [ hana ]
    usage: /hanatoki <enter|leave|admin> ...

permissions:
  hanatoki.enter:
    # ⚠ 預設是 op,不是 true。`/hanatoki enter` 是**開發/驗收指令**,不是玩家入口——玩家該走
    #   消費端插件自己建的入口(選單/NPC/告示牌...),透過 api/DungeonAccess 服務呼叫,那條路
    #   不查這個權限。留 true 的話玩家可以繞過那層入口,直接用指令指定任意 dungeonId 進場
    #   (包括還沒設計好給玩家碰的內容)。
    description: 直接用指令進出 HanaToki 副本 slot(開發/驗收用;玩家應該走消費端插件自建的入口)
    default: op
  hanatoki.admin:
    description: HanaToki 管理指令(list/kick/reset/debug)
    default: op
  hanatoki.build:
    # ⚠ 預設 false,**連 op 都沒有**。副本場地全部是程式化蓋出來的(回滾型/持久型/常駐型都是),
    #   管理員平常在裡面手滑放一顆方塊就會留在那裡。要改場地就明確開這個權限。
    description: 在 HanaToki 副本世界裡放/挖方塊(預設沒有人有)
    default: false
  hanatoki.dungeon.bypass:
    # 2026-09-03 改 op(Yana:「有管理員權限就可以過去副本看玩家」)。這條跟 hanatoki.build
    # 風險不對稱:build 擋的是「手滑改掉程式化場地」這種不可逆的意外破壞,這條只是放行「進場
    # 旁觀」,危害小得多,矛盾也不大——跟 hanatoki.admin(list/kick/reset/debug)同一個風險
    # 等級,理應同樣預設 op,不需要另外手動 LuckPerms 授權。
    description: 不受限地用 tpa/warp 等傳送手段進入 HanaToki 副本世界(旁觀用)
    default: op
