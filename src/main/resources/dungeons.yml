# HanaToki 副本定義(見 config/DungeonDefinition.kt)。
# test-empty:最小骨架驗證用,沒有 stage 圖,進去、計時、超時送回。
# test-puzzle/test-combat:分別是「解謎流程」與「最小戰鬥 encounter」的 architecture probe,
# 不是正式副本內容——正式內容一律屬於消費端(內容)插件,不住在引擎這個 repo 裡。
#
# 三座定義共用同一個世界 `hanatoki_probe`,靠 anchor-offset-z 互相錯開(各自沿 X 軸展開 slot,
# offset 只是把不同副本的整組 slot 挪到不同 Z 帶,避免 slot#0 撞在同一個座標——見
# DungeonDefinition KDoc)。
#
# ⚠ `world` 欄位**不要指向生存主世界**。副本場地是程式化蓋出來又要逐格回滾的,放在主世界會
#   佔用玩家的固定座標、被路人挖掉、回滾時在主世界產生可見的方塊跳變。預設 `world-create: true`
#   會在世界不存在時自動建一個 void 專屬世界(見 world/DungeonWorldProvisioner),不需要
#   Multiverse 或任何手動步驟;只有「場地是手工蓋好、世界由管理員準備」的常駐型副本才設 false。
# ⚠ **上線閘門**:下面三座 test-* 是引擎自帶的 architecture probe,不是正式內容。
#   它們都標了 `test-only: true`,**預設不會被註冊**(世界不建、slot 不登記、玩家看不到也
#   進不去)。開發/驗收時把這個值改成 true 再重啟。
#
#   為什麼需要這道閘門:`/hanatoki enter` 的權限雖然預設是 op,但這三座定義本來是無條件
#   註冊的——如果消費端插件另外替它們配了通關獎勵,一旦 op 權限被誤發給玩家,就多出一條
#   刷獎勵的路。定義不存在比「只是沒註冊 behavior」安全。
enable-test-dungeons: false

dungeons:
  test-empty:
    test-only: true
    display: "測試用空副本"
    world: hanatoki_probe
    slot-count: 2
    slot-spacing-blocks: 1024
    session-time-limit-seconds: 60
    solo-cap: 1
    party-cap: 4
    reconnect-grace-seconds: 30

  test-puzzle:
    test-only: true
    display: "三燈引路(測試)"
    description: "純解謎 architecture probe,不是正式內容"
    world: hanatoki_probe
    slot-count: 2
    slot-spacing-blocks: 1024
    anchor-offset-z: 5000
    session-time-limit-seconds: 180
    solo-cap: 1
    party-cap: 2
    reconnect-grace-seconds: 60
    tags: [puzzle]
    expected-minutes: "2-3"
    stages:
      start: entry
      list:
        entry: {}
        puzzle:
          timeout-seconds: 120
        ambush: {}
        clear_path: {}
    # ⚠ 所有偏移都刻意避開 (0,0,0):那是 slot anchor 本身,也是玩家進場的傳送點——
    # 如果哪個 interaction 用了 (0,0,0),進場那一刻玩家腳下的方塊會被 entry stage 換成實心方塊,
    # 直接把人卡住(實測踩過的坑)。
    interactions:
      mural: { x: 0, y: 0, z: -2, kind: right-click }
      lamp_a: { x: -2, y: 0, z: 2, kind: right-click }
      lamp_b: { x: 0, y: 0, z: 2, kind: right-click }
      lamp_c: { x: 2, y: 0, z: 2, kind: right-click }
      shrine: { x: 0, y: 0, z: 4, kind: right-click }
      door: { x: 0, y: 0, z: 6, kind: right-click }
      goal-plate: { x: 0, y: 0, z: 8, kind: physical }
    encounters:
      ambush-wave: { entity: ZOMBIE, count: 2, x: 0, y: 0, z: 2, radius: 2 }

  test-combat:
    test-only: true
    display: "測試戰鬥關(測試)"
    description: "最小 encounter/ architecture probe,不是正式內容"
    world: hanatoki_probe
    slot-count: 2
    slot-spacing-blocks: 1024
    anchor-offset-z: 10000
    session-time-limit-seconds: 90
    solo-cap: 1
    party-cap: 2
    reconnect-grace-seconds: 60
    tags: [pve]
    expected-minutes: "1"
    stages:
      start: entry
      list:
        entry:
          timeout-seconds: 60
    encounters:
      main-wave: { entity: ZOMBIE, count: 3, x: 0, y: 0, z: 3, radius: 2 }

  # 「安全 Run 容器」的 architecture probe(2026-08-29)。不是正式 Roguelike 內容——
  # 地圖、武器、Threat、Loot Director 都屬內容插件,這裡只證明引擎層的四件事:
  # 無時限 SESSION、局內背包隔離、死亡走 Resolution、局內物品帶不出去。
  test-roguelike:
    test-only: true
    display: "試作 Run(測試)"
    description: "無時限 + 局內背包隔離的引擎 probe,不是正式內容"
    world: hanatoki_probe
    slot-count: 2
    slot-spacing-blocks: 1024
    anchor-offset-z: 15000
    # ⚠ 無時限就明確寫 unlimited。不接受「填一個很大的秒數」——那個值會變成 HUD 上的假倒數,
    #   而且時間到時會真的把玩家的 Run 收掉(見 config/DungeonDefinition.parseTimeLimit)。
    session-time-limit-seconds: unlimited
    solo-cap: 1
    party-cap: 1
    reconnect-grace-seconds: 120
    # 死亡 = 一種 Run 結果(resultKey=death),不是「默默退出」。
    # 其他副本不設這個就維持既有語意(死亡 = 退出這一局,不結算)。
    death-resolution: true
    tags: [roguelike]
    expected-minutes: "不限"
    # 局內背包隔離:進場傳送落地之後才會拍永久背包快照、清空、發下面這組起始裝備。
    # 離場/死亡/斷線/關服/崩潰重啟都會把永久背包覆蓋還原(見 inventory/InstanceInventoryService)。
    instance-inventory:
      enabled: true
      loadout:
        - { material: STONE_SWORD, amount: 1, slot: 0, name: "<gray>試作刃</gray>" }
        - { material: BREAD, amount: 8, slot: 1 }
        - { material: TORCH, amount: 16, slot: 2 }
    stages:
      start: run
      list:
        run: {}
    interactions:
      # 撤離板。刻意不在 (0,0,0):那是 anchor 本身,也是進場落點。
      extract: { x: 3, y: 0, z: 3, kind: physical }
