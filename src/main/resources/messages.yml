# HanaToki 引擎自帶的訊息外部化(MiniMessage 原文,不是 legacy §)。
# `session.*` 是引擎本身的進出/重連提示(任何副本共用);`puzzle.*`/`combat.*` 是內建測試副本
# (architecture probe,非正式內容)的文字。正式副本的內容層文字屬 integration/內容插件的
# 責任(ARCH §11)——它自己載入後呼叫 `Texts.merge(...)` 併進來,不會放在這份檔案裡。
session:
  entered: "<green>已進入 {dungeon},限時 {seconds} 秒</green>"
  left: "<green>已離開副本</green>"
  no-slot: "<red>{dungeon} 目前客滿或不存在,稍後再試</red>"
  teleport-failed: "<red>傳送失敗,已從這一局移除</red>"
  reconnected: "<green>已重連回 {dungeon}</green>"
puzzle:
  entry: "<gray>一間小祠。三座花燈,一面壁畫——順序藏在畫裡。</gray>"
  mural-hint: "<yellow>壁畫暗示:先中,再左,最後右。</yellow>"
  lit: "<green>燈亮了({count}/3)</green>"
  already-lit: "<gray>這座燈已經亮著了</gray>"
  wrong: "<red>順序不對,燈全暗了……</red>"
  solved: "<green>三燈全亮!前方的門開了。</green>"
  shrine-success: "<light_purple>感應到一絲共鳴——順序是「中、左、右」。</light_purple>"
  shrine-fail: "<gray>感應失敗,什麼都沒看清。</gray>"
  ambush: "<red>錯解引來了騷動!</red>"
  ambush-cleared: "<green>清乾淨了,燈已經重置,再試一次。</green>"
  cleared: "<green>抵達終點,副本結算為通關!</green>"
  timeout: "<red>時間到,副本結算為逾時。</red>"
combat:
  entry: "<gray>三隻普通敵人擋在路上。</gray>"
  cleared: "<green>敵人全滅,副本結算為通關!</green>"
  timeout: "<red>時間到,副本結算為逾時。</red>"
